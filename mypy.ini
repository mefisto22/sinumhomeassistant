[mypy]
python_version = 3.14
strict = True
warn_unreachable = True
files = custom_components/sinum

# A HA komponensek a nevesített elemeket (pl. ColorMode, HVACMode) nem exportálják
# kifejezetten; a régebbi HA-verziók miatt mégis a komponens csomagjából importálunk.
[mypy-homeassistant.*]
implicit_reexport = True
